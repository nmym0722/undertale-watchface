<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Zepp Preview QR Viewer</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  body {
    background: #0a0a0f;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Segoe UI', monospace;
    color: #fff;
    gap: 24px;
    padding: 20px;
  }
  h2 { color: #ffff00; margin: 0; font-size: 1.4rem; }
  p { color: #888; font-size: 13px; margin: 0; text-align: center; }
  .input-row { display: flex; gap: 10px; width: 100%; max-width: 640px; }
  input {
    flex: 1;
    padding: 12px;
    font-size: 13px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #111;
    color: #fff;
    outline: none;
  }
  input:focus { border-color: #ffff00; }
  button {
    padding: 12px 20px;
    background: #ffff00;
    color: #000;
    font-weight: bold;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    white-space: nowrap;
  }
  button:hover { background: #dddd00; }
  #qr-wrap {
    background: #fff;
    padding: 24px;
    border-radius: 12px;
    display: none;
  }
  #qr-wrap.show { display: block; }
  .hint {
    background: rgba(255,255,0,0.08);
    border: 1px solid rgba(255,255,0,0.2);
    border-radius: 8px;
    padding: 14px 20px;
    font-size: 13px;
    color: #ccc;
    max-width: 520px;
    line-height: 1.7;
  }
</style>
</head>
<body>
  <h2>Zepp Preview QR Code</h2>
  <p>ターミナルに表示されたURLを貼り付けてQRコードを生成します</p>

  <div class="input-row">
    <input id="urlInput" type="text" placeholder="https://preview.zepp.com/..." />
    <button onclick="makeQR()">QR生成</button>
  </div>

  <div id="qr-wrap">
    <div id="qr"></div>
  </div>

  <div class="hint">
    <strong>手順：</strong><br>
    1. ターミナルで <code>zeus preview</code> を実行<br>
    2. 出力された URL（https://...）をコピー<br>
    3. 上の入力欄に貼り付けて「QR生成」<br>
    4. Zeppアプリ → 開発者モード → スキャン
  </div>

  <script>
    function makeQR() {
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return;
      const wrap = document.getElementById('qr-wrap');
      const qrDiv = document.getElementById('qr');
      qrDiv.innerHTML = '';
      wrap.classList.add('show');
      new QRCode(qrDiv, {
        text: url,
        width: 280,
        height: 280,
        colorDark: '#000000',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.M
      });
    }
    document.getElementById('urlInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') makeQR();
    });
  </script>
</body>
</html>
